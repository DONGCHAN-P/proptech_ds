<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">학교 심사 통과와 실제 개교 구분</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">학교 4곳</text><text x="620" y="288" font-size="37" fill="#111111">2025.10 중앙투자심사 통과 → 2029.3 목표</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">유치원 2곳</text><text x="620" y="423" font-size="37" fill="#111111">2025.11 재정투자심사 통과 → 2029.3 목표</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">왕숙2 A1</text><text x="620" y="558" font-size="37" fill="#111111">2029.2 입주 예정 / 배정·통학로 미확인</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">왕숙2 A3</text><text x="620" y="693" font-size="37" fill="#111111">2030.5 입주 예정 / 개교 준비 재확인</text><text x="100" y="955" font-size="27" fill="#6E6E6E">교육지원청 발표·LH 안내 기준. 개교 목표가 개별 단지 배정을 보장하지 않습니다.</text></g></svg>