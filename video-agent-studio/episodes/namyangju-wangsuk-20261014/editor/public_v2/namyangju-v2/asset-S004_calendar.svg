<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">입주 예정과 철도 목표는 다른 달력</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">왕숙2 A1</text><text x="620" y="288" font-size="37" fill="#111111">2029년 2월 입주 예정</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">왕숙2 A3</text><text x="620" y="423" font-size="37" fill="#111111">2030년 5월 입주 예정</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">GTX-B</text><text x="620" y="558" font-size="37" fill="#111111">2031년 개통 목표 / 국토부 2026 업무계획</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">강동하남남양주선</text><text x="620" y="693" font-size="37" fill="#111111">기본계획 승인 / 2026.9 공구별 추진 요구</text><text x="100" y="955" font-size="27" fill="#6E6E6E">입주·개통은 예정 및 목표. 역 출입구·도보권·실측 통근시간 미확인.</text></g></svg>