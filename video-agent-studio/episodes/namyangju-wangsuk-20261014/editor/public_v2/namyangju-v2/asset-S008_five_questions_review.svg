<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">남양주 자료로 다시 보는 다섯 질문</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">일자리</text><text x="620" y="288" font-size="30" fill="#111111">기존 산단·인가·허가 구분 / 운영 미확인</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">철도</text><text x="620" y="423" font-size="30" fill="#111111">운영·계획·입주 시차 / 출입구 미확인</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">분양가</text><text x="620" y="558" font-size="30" fill="#111111">표시가격 확인 / 주변 비교·총비용 미완</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">생활시설</text><text x="620" y="693" font-size="30" fill="#111111">심사·개교 목표 / 배정·통학로 미확인</text><rect x="100" y="760" width="1720" height="110" rx="18" fill="white"/><text x="135" y="828" font-size="40" fill="#2F6FED">생활권 공급</text><text x="620" y="828" font-size="30" fill="#111111">계획·블록 일정 / 생활권 총물량 미완</text><text x="100" y="955" font-size="27" fill="#6E6E6E">확인한 범위와 남은 질문을 구분합니다. 사업 완료 점수나 투자 추천이 아닙니다.</text></g></svg>