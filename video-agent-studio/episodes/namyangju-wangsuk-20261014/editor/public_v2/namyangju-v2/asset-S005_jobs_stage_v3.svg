<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">일자리: 기업 이름보다 진행 단계</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">기존 산업 기반</text><text x="620" y="288" font-size="32" fill="#111111">진관·금곡·광릉테크노밸리 / 조성 완료</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">왕숙 산업단지</text><text x="620" y="423" font-size="32" fill="#111111">2026.10.8 개발실시계획 승인·고시 발표</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">입주 예정기업</text><text x="620" y="558" font-size="32" fill="#111111">우리금융·카카오·신한 / 실제 운영 미확인</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">우리금융</text><text x="620" y="693" font-size="32" fill="#111111">2026.5 건축허가 / 2029년 준공 목표</text><text x="100" y="955" font-size="27" fill="#6E6E6E">남양주시 공식 자료 | 계획·허가와 준공·실제 상주인력 구분</text></g></svg>