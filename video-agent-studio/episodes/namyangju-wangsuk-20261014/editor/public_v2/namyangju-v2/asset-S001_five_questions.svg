<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">광교·동탄에서 남양주로: 같은 다섯 질문</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">일자리</text><text x="620" y="288" font-size="37" fill="#111111">사업장 위치와 현재 진행 단계</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">철도</text><text x="620" y="423" font-size="37" fill="#111111">지금 운행 / 미래 계획 / 입주 시차</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">분양가</text><text x="620" y="558" font-size="37" fill="#111111">같은 면적·타입·가격 조건</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">생활시설</text><text x="620" y="693" font-size="37" fill="#111111">이용 가능한 때와 학교 배정</text><rect x="100" y="760" width="1720" height="110" rx="18" fill="white"/><text x="135" y="828" font-size="40" fill="#2F6FED">생활권 공급</text><text x="620" y="828" font-size="37" fill="#111111">계획 규모와 연도별 입주 구분</text><text x="100" y="955" font-size="27" fill="#6E6E6E">전편의 질문을 계승합니다. 과거 가격 상승을 왕숙에 적용하지 않습니다.</text></g></svg>