<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F4EF"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="130" font-size="62" fill="#111111">왕숙1 · 왕숙2: 서로 다른 지구</text><rect x="100" y="220" width="1720" height="110" rx="18" fill="white"/><text x="135" y="288" font-size="40" fill="#2F6FED">왕숙1</text><text x="620" y="288" font-size="37" fill="#111111">진접·진건·퇴계원읍 / 계획 64,159세대</text><rect x="100" y="355" width="1720" height="110" rx="18" fill="white"/><text x="135" y="423" font-size="40" fill="#2F6FED">왕숙2</text><text x="620" y="423" font-size="37" fill="#111111">일패·이패동 / 계획 15,955세대</text><rect x="100" y="490" width="1720" height="110" rx="18" fill="white"/><text x="135" y="558" font-size="40" fill="#2F6FED">계획 면적</text><text x="620" y="558" font-size="37" fill="#111111">왕숙1 약 1,029만㎡ / 왕숙2 약 239만㎡</text><rect x="100" y="625" width="1720" height="110" rx="18" fill="white"/><text x="135" y="693" font-size="40" fill="#2F6FED">전체 계획 ≠ 입주</text><text x="620" y="693" font-size="37" fill="#111111">80,114세대는 두 지구 계획의 단순 합계</text><text x="100" y="955" font-size="27" fill="#6E6E6E">남양주시 사업개요 2026.3.4 | 최신 변경고시 전수 대조 미완료</text></g></svg>