<template><style>#CAPTIONS{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}</style><div data-hf-id="hf-6ajj" id="CAPTIONS" data-composition-id="CAPTIONS" data-width="1920" data-height="1080" data-duration="736.949705215"><div data-hf-id="hf-hxat" id="main-v2-caption-bg-0" class="clip" data-caption-bg="true" data-start="0.000000" data-duration="12.301497" data-track-index="4" data-track-kind="captions" style="position:absolute;left:96px;top:922px;width:1728px;height:130px;background:#fff;border-radius:13px"></div><div data-hf-id="hf-o3cl" id="main-v2-caption-bg-1" class="clip" data-caption-bg="true" data-start="17.301497" data-duration="706.648209" data-track-index="4" data-track-kind="captions" style="position:absolute;left:96px;top:922px;width:1728px;height:130px;background:#fff;border-radius:13px"></div><div data-hf-id="hf-jcv0" id="main-cue-0" class="clip caption fit" data-min-font="24" data-start="0.083333333" data-duration="3.962962963" data-track-index="4" data-track-kind="captions">오늘은 수도권 53개 구 가운데 신혼부부 거주 수 상위 스무 곳을 20위부터</div><div data-hf-id="hf-n3h9" id="main-cue-1" class="clip caption fit" data-min-font="24" data-start="4.046296296" data-duration="1.472222222" data-track-index="4" data-track-kind="captions">1위까지 살펴보겠습니다.</div><div data-hf-id="hf-w354" id="main-cue-2" class="clip caption fit" data-min-font="24" data-start="6.250000000" data-duration="2.574074074" data-track-index="4" data-track-kind="captions">각 지역의 주거 환경과 실제 랜드마크를 짚고,</div><div data-hf-id="hf-rx4r" id="main-cue-3" class="clip caption fit" data-min-font="24" data-start="8.824074074" data-duration="2.759259259" data-track-index="4" data-track-kind="captions">같은 조건의 아파트 거래가격을 지도에 연결하겠습니다.</div><div data-hf-id="hf-uh3w" id="main-cue-4" class="clip caption fit" data-min-font="24" data-start="17.375570673" data-duration="3.916666667" data-track-index="4" data-track-kind="captions">순위의 출처는 국가데이터처가 발표한 2024년 신혼부부통계입니다.</div><div data-hf-id="hf-v86t" id="main-cue-5" class="clip caption fit" data-min-font="24" data-start="22.005200302" data-duration="2.500000000" data-track-index="4" data-track-kind="captions">2024년 11월 1일 거주지를 기준으로,</div><div data-hf-id="hf-roca" id="main-cue-6" class="clip caption fit" data-min-font="24" data-start="24.505200302" data-duration="3.481481481" data-track-index="4" data-track-kind="captions">혼인신고 후 5년이 지나지 않은 부부를 초혼과 재혼을 합쳐 쌍 단위로</div><div data-hf-id="hf-e0e9" id="main-cue-7" class="clip caption fit" data-min-font="24" data-start="27.986681784" data-duration="0.694444444" data-track-index="4" data-track-kind="captions">비교합니다.</div><div data-hf-id="hf-flq0" id="main-cue-8" class="clip caption fit" data-min-font="24" data-start="29.403348450" data-duration="2.685185185" data-track-index="4" data-track-kind="captions">이후 입주와 이사로 거주 분포가 달라질 수 있어,</div><div data-hf-id="hf-aemx" id="main-cue-9" class="clip caption fit" data-min-font="24" data-start="32.088533636" data-duration="2.314814815" data-track-index="4" data-track-kind="captions">당시의 분포를 출발점으로 살펴보겠습니다.</div><div data-hf-id="hf-7gpd" id="main-cue-10" class="clip caption fit" data-min-font="24" data-start="35.134829932" data-duration="3.879629630" data-track-index="4" data-track-kind="captions">가격은 2026년 5월부터 10월까지 계약된 아파트 매매 실거래를</div><div data-hf-id="hf-hnp6" id="main-cue-11" class="clip caption fit" data-min-font="24" data-start="39.014459562" data-duration="2.361111111" data-track-index="4" data-track-kind="captions">2026년 11월 3일 조회한 자료입니다.</div><div data-hf-id="hf-ekvv" id="main-cue-12" class="clip caption fit" data-min-font="24" data-start="42.125570673" data-duration="3.888888889" data-track-index="4" data-track-kind="captions">전용면적 83제곱미터 이상 85제곱미터 이하의 거래를 비교합니다.</div><div data-hf-id="hf-pol6" id="main-cue-13" class="clip caption fit" data-min-font="24" data-start="46.736681784" data-duration="2.166666667" data-track-index="4" data-track-kind="captions">10월 계약분은 신고가 진행 중이어서,</div><div data-hf-id="hf-0fw3" id="main-cue-14" class="clip caption fit" data-min-font="24" data-start="48.903348450" data-duration="3.685185185" data-track-index="4" data-track-kind="captions">조회 뒤 추가 신고나 정정·해제에 따라 수치가 달라질 수 있습니다.</div><div data-hf-id="hf-9jia" id="main-cue-15" class="clip caption fit" data-min-font="24" data-start="53.329274376" data-duration="3.935185185" data-track-index="4" data-track-kind="captions">중위값은 거래금액을 낮은 순서대로 놓았을 때 가운데에 해당하는 값입니다.</div><div data-hf-id="hf-j9wv" id="main-cue-16" class="clip caption fit" data-min-font="24" data-start="58.049879063" data-duration="3.379629630" data-track-index="4" data-track-kind="captions">20위는 부천시 원미구, 7,365쌍입니다.</div><div data-hf-id="hf-ouz4" id="main-cue-17" class="clip caption fit" data-min-font="24" data-start="62.170249433" data-duration="4.333333333" data-track-index="4" data-track-kind="captions">원미구는 중동과 상동에 걸쳐 형성된 중동신도시의 아파트 생활권을 포함합니다.</div><div data-hf-id="hf-84h9" id="main-cue-18" class="clip caption fit" data-min-font="24" data-start="67.272101285" data-duration="3.583333333" data-track-index="4" data-track-kind="captions">부천시 정비기본계획은 공동주택 블록과 마을 단위를 함께 다뤄,</div><div data-hf-id="hf-4nq1" id="main-cue-19" class="clip caption fit" data-min-font="24" data-start="70.855434618" data-duration="2.787037037" data-track-index="4" data-track-kind="captions">개별 단지와 주변 주거지를 같이 살펴볼 기준이 됩니다.</div><div data-hf-id="hf-l8cz" id="main-cue-20" class="clip caption fit" data-min-font="24" data-start="74.392471655" data-duration="3.870370370" data-track-index="4" data-track-kind="captions">부천중앙공원은 중동신도시 개발과 함께 조성된 근린공원입니다.</div><div data-hf-id="hf-wdl6" id="main-cue-21" class="clip caption fit" data-min-font="24" data-start="78.994323507" data-duration="3.805555556" data-track-index="4" data-track-kind="captions">같은 조건으로 집계한 부천시 원미구 거래 699건의 중위값은</div><div data-hf-id="hf-b1dx" id="main-cue-22" class="clip caption fit" data-min-font="24" data-start="82.799879063" data-duration="1.203703704" data-track-index="4" data-track-kind="captions">7억500만원입니다.</div><div data-hf-id="hf-ubt4" id="main-cue-23" class="clip caption fit" data-min-font="24" data-start="84.716545729" data-duration="3.648148148" data-track-index="4" data-track-kind="captions">중동의 미리내마을(롯데2) 단지 사례는 같은 조건 8건의 중위값이</div><div data-hf-id="hf-peor" id="main-cue-24" class="clip caption fit" data-min-font="24" data-start="88.364693878" data-duration="1.425925926" data-track-index="4" data-track-kind="captions">7억450만원입니다.</div><div data-hf-id="hf-burk" id="main-cue-25" class="clip caption fit" data-min-font="24" data-start="90.584754346" data-duration="3.185185185" data-track-index="4" data-track-kind="captions">19위는 서울 중랑구, 7,547쌍입니다.</div><div data-hf-id="hf-59w3" id="main-cue-26" class="clip caption fit" data-min-font="24" data-start="94.519939531" data-duration="3.462962963" data-track-index="4" data-track-kind="captions">중랑구 신내동은 택지개발로 아파트 주거지가 조성된 지역입니다.</div><div data-hf-id="hf-6sv8" id="main-cue-27" class="clip caption fit" data-min-font="24" data-start="98.723643235" data-duration="3.787037037" data-track-index="4" data-track-kind="captions">현재 신내역은 경춘선과 6호선을 이용할 수 있는 철도 거점입니다.</div><div data-hf-id="hf-gqju" id="main-cue-28" class="clip caption fit" data-min-font="24" data-start="103.279198791" data-duration="4.324074074" data-track-index="4" data-track-kind="captions">역 주변 생활시설로는 서울의료원과 청남공원이 공식 주거정보에 안내돼 있습니다.</div><div data-hf-id="hf-cm6s" id="main-cue-29" class="clip caption fit" data-min-font="24" data-start="108.334754346" data-duration="4.583333333" data-track-index="4" data-track-kind="captions">같은 조건으로 집계한 중랑구 거래 404건의 중위값은 7억9,150만원입니다.</div><div data-hf-id="hf-x9wg" id="main-cue-30" class="clip caption fit" data-min-font="24" data-start="113.621791383" data-duration="4.861111111" data-track-index="4" data-track-kind="captions">면목동의 현대 단지 사례는 같은 조건 8건의 중위값이 8억250만원입니다.</div><div data-hf-id="hf-nuvi" id="main-cue-31" class="clip caption fit" data-min-font="24" data-start="119.300604686" data-duration="3.324074074" data-track-index="4" data-track-kind="captions">18위는 용인시 기흥구, 7,686쌍입니다.</div><div data-hf-id="hf-cqd3" id="main-cue-32" class="clip caption fit" data-min-font="24" data-start="123.374678760" data-duration="4.675925926" data-track-index="4" data-track-kind="captions">기흥구는 동백·흥덕의 대규모 택지개발 주거지와 기업·연구시설이 함께 자리한</div><div data-hf-id="hf-20m7" id="main-cue-33" class="clip caption fit" data-min-font="24" data-start="128.050604686" data-duration="0.675925926" data-track-index="4" data-track-kind="captions">지역입니다.</div><div data-hf-id="hf-zex0" id="main-cue-34" class="clip caption fit" data-min-font="24" data-start="129.495049131" data-duration="3.074074074" data-track-index="4" data-track-kind="captions">구성역은 GTX-A와 수인분당선이 만나는 거점입니다.</div><div data-hf-id="hf-exbx" id="main-cue-35" class="clip caption fit" data-min-font="24" data-start="133.309863946" data-duration="2.546296296" data-track-index="4" data-track-kind="captions">동백과 구성역 주변은 서로 다른 생활권이므로,</div><div data-hf-id="hf-8b4a" id="main-cue-36" class="clip caption fit" data-min-font="24" data-start="135.856160242" data-duration="2.185185185" data-track-index="4" data-track-kind="captions">단지와 역 위치를 함께 살펴보겠습니다.</div><div data-hf-id="hf-lk55" id="main-cue-37" class="clip caption fit" data-min-font="24" data-start="138.782086168" data-duration="3.972222222" data-track-index="4" data-track-kind="captions">같은 조건으로 집계한 용인시 기흥구 거래 1,381건의 중위값은</div><div data-hf-id="hf-ypyx" id="main-cue-38" class="clip caption fit" data-min-font="24" data-start="142.754308390" data-duration="1.157407407" data-track-index="4" data-track-kind="captions">6억2,000만원입니다.</div><div data-hf-id="hf-h8c3" id="main-cue-39" class="clip caption fit" data-min-font="24" data-start="144.615419501" data-duration="4.685185185" data-track-index="4" data-track-kind="captions">영덕동의 용인기흥효성해링턴플레이스 단지 사례는 같은 조건 35건의 중위값이</div><div data-hf-id="hf-nkny" id="main-cue-40" class="clip caption fit" data-min-font="24" data-start="149.300604686" data-duration="1.212962963" data-track-index="4" data-track-kind="captions">6억6,000만원입니
