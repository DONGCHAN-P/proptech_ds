			margin: 0;
			text-align: center;
			background-color: #f8f9fa;
			letter-spacing: -0.7px;
		}

		.content-1 h1 {
			font-family: sb, sans-serif;
			font-weight: bold;
			font-size: 28px;
			color: #343a40;
			margin: 0;
		}

		.content-1 p {
			font-family: sr, sans-serif;
			font-size: 14px;
			color: #868e96;
		}

		.line {
			width: 100%;
			height: 1px;
			background-color: #dee2e6;
			margin: 55px auto;
		}

		.container {
			margin-top: 50px;
		}

		.container h2 {
			font-family: sr, sans-serif;
			font-size: 16px;
			margin-bottom: 15px;
			text-align: left;
		}

		.content-input p {
			text-align: left;
		}

		table {
			width: 100%;
			margin: 0 auto;
		}

		table tr {
			font-family: sr, sans-serif;
			font-size: 14px;
			color: #495057;
			text-align: left;
		}

		input[type="text"] {
			width: 100%;
			padding: 10px 10px;
			border: 1px solid #ced4da;
			border-radius: 3px;
			box-sizing: border-box;
		}

		.card {
			width: 400px;
			padding: 50px 60px;
			margin: 15% auto 0;
			background-color: #fff;
			border: none;
			border-radius: 10px;
			box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.1);
		}

		.btn-primary:not(hover) {
			font-family: sr, sans-serif;
			font-weight: bold;
			font-size: 14px;
			color: #fff;
			width: 100%;
			background-color: #2196f3;
			border: none;
			border-radius: 4px;
			padding: 16px 48px;
			cursor: pointer;
			outline: 0;
			box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
			transition: all 0.1s linear;
		}

		.btn-primary:hover {
			background-color: #309bf3;
			box-shadow: 0 3px 15px 0 rgba(0, 174, 239, 0.4);
			transition: all 0.1s linear;
		}

		.btn-primary:active {
			background-color: #0090d1;
			box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
		}

		#mini_frame {
			background-color: #fff;
			border-radius: 5px;
			padding: 20px;
			box-shadow: 0 6px 18px 2px rgba(0, 0, 0, 0.1);
		}

		#mini_calendar,
		#mini_calendar2 {
			padding: 20px;
		}

		.box-calendar {
			width: 94%;
			position: relative;
			display: inline-block;
		}

		.box-calendar p {
			position: absolute;
			top: 0;
			right: 0;
			margin: 0;
		}

		.searchInput input[type="text"] {
			padding: 6px 10px;
		}

		.searchInput {
			margin-bottom: 60px;
		}

		.logo {
			width: 100px;
			margin: 0 auto;
			margin-bottom: 20px;
		}

		.content-1 p {
			color: #4c4a379e;
			font-weight: 1000;
			font-family: sb, sans-serif;
			font-size: 18px;
			line-height: 32px;
			margin: 0 0 0px;
		}

			font-weight: 500;

			font-size: 14px;
			line-height: 32px;
