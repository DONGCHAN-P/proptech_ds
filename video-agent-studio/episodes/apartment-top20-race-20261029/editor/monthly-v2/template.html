</div><script>
const DATA=__PAYLOAD__,FRAMES=DATA.frames,LABELS=DATA.labels,TIMING=DATA.timing,TOTAL=TIMING.duration,PITCH=36.8;
const KEYS=Object.keys(LABELS).sort(),EL={},MAPS=FRAMES.map(f=>new Map(f.rows.map(r=>[r.id,r]))),N=FRAMES.length;

function money(v){return (Math.round((v+1e-9)*100)/100).toFixed(2);}
// Uniform-knot Fritsch-Carlson harmonic slopes: C1, monotone, flat intervals stay flat.
function slopes(y){const d=y.slice(1).map((v,i)=>v-y[i]),m=new Array(y.length).fill(0);for(let i=1;i<y.length-1;i++)if(d[i-1]*d[i]>0)m[i]=2*d[i-1]*d[i]/(d[i-1]+d[i]);return m;}
function track(y){return {y,m:slopes(y)};}
function sample(a,x){const i=Math.min(N-2,Math.floor(x)),u=x-i,y=a.y,m=a.m;return (2*u*u*u-3*u*u+1)*y[i]+(u*u*u-2*u*u+u)*m[i]+(-2*u*u*u+3*u*u)*y[i+1]+(u*u*u-u*u)*m[i+1];}
const TRACKS={};
for(const id of KEYS){let last=null;const first=MAPS.find(m=>m.has(id)).get(id),v=[],p=[],a=[];for(const m of MAPS){const r=m.get(id);if(r)last=r;v.push((last||first).v);p.push(r?r.r:20.8);a.push(r?1:0);}TRACKS[id]={value:track(v),position:track(p),alpha:track(a)};}
const scales=FRAMES.map(f=>Math.max(5,Math.ceil(f.rows[0].v/5)*5)),SCALE=track(scales);
for(let i=0;i<20;i++){const e=document.createElement('div');e.className='rank measure';e.textContent=i+1;e.style.top=(i*PITCH)+'px';document.getElementById('rank-column').appendChild(e);}
for(let k=0;k<KEYS.length;k++){const id=KEYS[k],l=LABELS[id],e=document.createElement('div');e.className='racerow';e.id='complex-'+k;e.dataset.cid=id;e.style.setProperty('--color',l.color);e.innerHTML='<div class="rowbar"></div><div class="rowtip"></div><span class="asof measure"></span><span class="name measure"></span><span class="count measure"></span><span class="value measure"></span>';e.querySelector('.name').textContent=l.name;e.querySelector('.name').style.fontSize=l.font_size+'px';document.getElementById('rows').appendChild(e);EL[id]={root:e,bar:e.querySelector('.rowbar'),tip:e.querySelector('.rowtip'),value:e.querySelector('.value'),count:e.querySelector('.count'),asof:e.querySelector('.asof')};}
function render(t){const x=clamp((t-TIMING.first_hold)/TIMING.month_step,0,N-1),i=Math.min(N-1,Math.floor(x+1e-9)),j=Math.min(N-1,i+1),nearest=Math.round(x),a=FRAMES[i],b=FRAMES[j],target=FRAMES[nearest],u=x-i,scale=sample(SCALE,x),active=[];
 for(const id of KEYS){const tr=TRACKS[id],alpha=sample(tr.alpha,x),pos=sample(tr.position,x),value=sample(tr.value,x),e=EL[id];if(alpha<.002||pos>=20.6){e.root.style.opacity='0';continue;}
  const r=MAPS[nearest].get(id)||MAPS[i].get(id)||MAPS[j].get(id),entering=!MAPS[i].has(id)&&MAPS[j].has(id),moving=(tr.position.y[j]??pos)!==tr.position.y[i];
  e.root.style.opacity=String(alpha);e.root.style.transform='translateY('+(Math.min(pos,19)*PITCH)+'px)';e.root.style.zIndex=String(1000-Math.round(pos*10)+(moving?300:0));
  e.bar.style.transform='scaleX('+clamp(value/scale,0,1)+')';e.bar.style.opacity=entering?'.36':'.22';e.tip.style.transform='translateX('+(366*clamp(value/scale,0,1))+'px)';
  e.value.textContent=money(value);e.count.textContent=String(r.n);e.asof.textContent=r.asof.slice(2).replace('-','.');
  active.push({id,pos,value,alpha,labelsVisible:true,priority:MAPS[i].get(id)?.r??(100+(MAPS[j].get(id)?.r??20)),quote_asof_month:r.asof,carried:r.carried});
 }
 // Overtaking depth: the rear label gently loses contrast, never switches off.
 // Priority is fixed for the whole month interval; there is no mid-crossing flip.
 for(const q of active){const distance=active.filter(v=>v.id!==q.id&&v.priority<q.priority&&v.alpha>.1).reduce((n,v)=>Math.min(n,Math.abs(Math.min(v.pos,19)-Math.min(q.pos,19))*PITCH),1000),u=clamp(distance/34,0,1),contrast=.1+.9*u*u*(3-2*u);for(const e of EL[q.id].root.querySelectorAll('span'))e.style.opacity=String(contrast);q.labelContrast=contrast;}
 const period=target.p.replace('-','.')+'  /  2026.06';document.getElementById('period').textContent=period;
 document.getElementById('axis-mid').textContent=money(scale/2).replace(/\.00$/,'');document.getElementById('axis-max').textContent=money(scale).replace(/\.00$/,'');
 const leader=LABELS[target.leader];document.getElementById('event').textContent=t>=TIMING.CTA_start?'다음 데이터도 궁금하다면 구독 · 좋아요':(t<TIMING.first_hold?'2006 → 2026, 어떤 단지가 치고 올라올까?':'1위 · '+leader.region+' '+leader.name);
 document.getElementById('progress').style.transform='scaleX('+clamp(t/TIMING.race_end,.01,1)+')';
 window.__frameState={time:t,x,i,j,u,period:target.p,scale,active,expected:target.rows,stable:Math.abs(x-Math.round(x))<1e-7};
}
const driver={t:0},tl=gsap.timeline({paused:true});tl.to(driver,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:()=>render(driver.t)},0);
window.__timelines=window.__timelines||{};window.__timelines['apt-top20-monthly']=tl;window.__sourceSeek=t=>{tl.seek(t,false);render(t);};window.__raceData=DATA;window.__tracks=TRACKS;window.__sample=sample;render(0);
