<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평소지도 — 우리 동네, 평소와 다른가</title>
<meta name="description" content="수도권 아파트 실거래를 각 지역의 자기 평소와 견줍니다. 비싼 곳이 아니라 평소와 달라진 곳을 보여줍니다.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 좌측: 읽는 패널 -->
<aside id="side">
  <header id="brand">
    <h1>평소지도</h1>
    <p class="tag">비싼 곳이 아니라 <b>평소와 달라진 곳</b>을 칠합니다.</p>
  </header>

  <section id="headline" class="block">
    <div class="skeleton">불러오는 중…</div>
  </section>

  <nav id="levelbar" class="block">
    <button class="lv on" data-level="sgg">시군구</button>
    <button class="lv" data-level="dong">읍면동</button>
    <button class="lv" data-level="apt">단지</button>
  </nav>

  <!-- 평형 — 단지 레벨에서만. 평형을 안 고르면 대표 평형(최근 1년 거래가
       가장 많은 평형)으로 보여준다. -->
  <section id="pyeongbar" class="block" hidden>
    <h2>평형</h2>
    <div class="chips" id="pyeongs"></div>
    <p class="note" id="pyeongnote"></p>
  </section>

  <section class="block" id="ranks">
    <h2 id="busyh">평소보다 붐빈 곳</h2>
    <ol id="busy" class="ranklist"></ol>
    <h2 id="quieth" style="margin-top:22px">평소보다 조용한 곳</h2>
    <ol id="quiet" class="ranklist"></ol>
  </section>

  <section class="block" id="legend">
    <h2>지도 보는 법</h2>
    <ul class="legend"></ul>
    <p class="note"></p>
  </section>

  <section class="block" id="limits">
    <h2>이 지도가 보여주지 <em>않는</em> 것</h2>
    <ul class="limits"></ul>
  </section>

  <footer id="foot"></footer>
</aside>

<!-- 우측: 지도 -->
<main id="mapwrap">
  <div id="map"></div>

  <div id="searchbox">
    <input id="q" type="search" placeholder="지역이나 단지 이름" autocomplete="off">
    <ul id="suggest"></ul>
  </div>

  <div id="statebar"></div>
</main>

<!-- 상세 서랍 -->
<section id="drawer" hidden>
  <button id="close" aria-label="닫기">×</button>
  <div id="detail"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/util.js"></script>
<script src="/js/map.js"></script>
<script src="/js/panel.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
