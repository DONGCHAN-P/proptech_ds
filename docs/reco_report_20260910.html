<style>
/* ── 토큰 (라이트) */
:root {
  --bg: #F4F3EF;
  --bg2: #ECEAE4;
  --bg3: #E3E1DA;
  --card: #FFFFFF;
  --border: #D8D5CC;
  --border2: #C4C0B6;
  --text: #18170F;
  --muted: #6B6860;
  --muted2: #9C9A93;
  --accent: #B87818;
  --accent-bg: #FFF8EC;
  --green: #0F7B4B;
  --green-bg: #ECFFF5;
  --blue: #1E50A0;
  --blue-bg: #EEF4FF;
  --purple: #6035B8;
  --purple-bg: #F4EEFF;
  --red: #B83535;
  --red-bg: #FFEEEE;
  --teal: #107070;
  --teal-bg: #ECFFFF;
  --rank-text: #8A6020;
  --score-track: #E0DDD6;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --serif: 'Noto Serif KR', 'Georgia', serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E1A;
    --bg2: #131728;
    --bg3: #1B2040;
    --card: #141829;
    --border: #1E2438;
    --border2: #2A3060;
    --text: #C8D0E8;
    --muted: #4A5275;
    --muted2: #354060;
    --accent: #E8A830;
    --accent-bg: #1E1608;
    --green: #22C55E;
    --green-bg: #0A1F12;
    --blue: #60A5FA;
    --blue-bg: #0A1224;
    --purple: #A78BFA;
    --purple-bg: #120E20;
    --red: #F87171;
    --red-bg: #200A0A;
    --teal: #2DD4BF;
    --teal-bg: #041414;
    --rank-text: #E8A830;
    --score-track: #1E2438;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0E1A; --bg2: #131728; --bg3: #1B2040;
  --card: #141829; --border: #1E2438; --border2: #2A3060;
  --text: #C8D0E8; --muted: #4A5275; --muted2: #354060;
  --accent: #E8A830; --accent-bg: #1E1608;
  --green: #22C55E; --green-bg: #0A1F12;
  --blue: #60A5FA; --blue-bg: #0A1224;
  --purple: #A78BFA; --purple-bg: #120E20;
  --red: #F87171; --red-bg: #200A0A;
  --teal: #2DD4BF; --teal-bg: #041414;
  --rank-text: #E8A830; --score-track: #1E2438;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;
  min-height: 100vh;
}

/* ── 헤더 */
.site-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-brand {
  display: flex; flex-direction: column; padding: 14px 0 12px;
}
.brand-title {
  font-family: var(--serif);
  font-size: 18px; font-weight: 900;
  color: var(--accent);
  letter-spacing: -.01em;
  line-height: 1.2;
}
.brand-sub {
  font-size: 11px; color: var(--muted);
  letter-spacing: .04em; margin-top: 3px;
}
.header-stats {
  display: flex; gap: 0;
}
.hstat {
  text-align: right; padding: 12px 0 12px 24px;
  border-left: 1px solid var(--border);
  padding-left: 20px;
}
.hstat:first-child { border-left: none; }
.hstat-v {
  font-family: var(--mono);
  font-size: 18px; font-weight: 700;
  color: var(--text); line-height: 1.2;
}
.hstat-l {
  font-size: 10px; color: var(--muted);
  letter-spacing: .06em; margin-top: 2px;
}

/* ── 탭 */
.tab-nav {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 73px; z-index: 90;
}
.tab-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 20px;
  display: flex; gap: 0;
}
.tab-btn {
  font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: var(--muted); background: none; border: none;
  padding: 13px 20px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── 탭 설명 */
.tab-desc {
  max-width: 900px; margin: 0 auto;
  padding: 14px 20px 0;
}
.desc-box {
  background: var(--accent-bg);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  padding: 10px 14px;
  font-size: 12px; color: var(--muted);
  line-height: 1.6;
}
.desc-box strong { color: var(--accent); }

/* ── 메인 */
.main {
  max-width: 900px; margin: 0 auto;
  padding: 20px 20px 60px;
  display: flex; flex-direction: column; gap: 12px;
}

/* ── 카드 */
.apt-card {
  background: var(--card);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 0;
  transition: border-color .15s;
}
.apt-card:hover { border-color: var(--border2); }

.card-rank {
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 18px 8px 16px;
  border-right: 1px solid var(--border);
  background: var(--bg2);
}
.rank-num {
  font-family: var(--serif);
  font-size: 28px; font-weight: 900;
  color: var(--rank-text); line-height: 1;
}
.rank-num.gold { color: #C8920A; }
.rank-num.silver { color: #8A9AB0; }
.rank-num.bronze { color: #A06830; }
.rank-medal {
  font-size: 16px; margin-top: 4px;
}
.rank-score {
  font-family: var(--mono);
  font-size: 11px; font-weight: 700;
  color: var(--muted); margin-top: 6px;
  letter-spacing: -.02em;
}

.card-body { padding: 16px 18px 16px; }

.card-head {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 6px;
}
.apt-name {
  font-family: var(--serif);
  font-size: 16px; font-weight: 700;
  color: var(--text); line-height: 1.3;
  text-wrap: balance;
}
.price-badge {
  font-family: var(--mono);
  font-size: 18px; font-weight: 700;
  color: var(--accent); flex-shrink: 0;
  line-height: 1.2;
}

.apt-meta {
  font-size: 11.5px; color: var(--muted);
  margin-bottom: 10px; letter-spacing: .01em;
}
.apt-meta span { color: var(--text); font-weight: 600; }

/* 태그 */
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag {
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; letter-spacing: .04em;
  border: 1px solid; white-space: nowrap;
}
.tag-green  { color: var(--green);  background: var(--green-bg);  border-color: color-mix(in srgb, var(--green)  40%, transparent); }
.tag-blue   { color: var(--blue);   background: var(--blue-bg);   border-color: color-mix(in srgb, var(--blue)   40%, transparent); }
.tag-amber  { color: var(--accent); background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.tag-purple { color: var(--purple); background: var(--purple-bg); border-color: color-mix(in srgb, var(--purple) 40%, transparent); }
.tag-teal   { color: var(--teal);   background: var(--teal-bg);   border-color: color-mix(in srgb, var(--teal)   40%, transparent); }
.tag-red    { color: var(--red);    background: var(--red-bg);    border-color: color-mix(in srgb, var(--red)    40%, transparent); }

/* 점수 바 */
.score-row {
  margin-bottom: 10px;
}
.score-bar-wrap {
  height: 6px;
  background: var(--score-track);
  display: flex; gap: 1px; overflow: hidden;
  margin-bottom: 4px;
}
.score-seg { height: 100%; transition: width .3s; }
.score-labels {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 2px;
}
.score-lbl {
  font-family: var(--mono);
  font-size: 9.5px; color: var(--muted);
  display: flex; flex-direction: column; gap: 1px;
}
.score-lbl-name { color: var(--muted2); font-size: 9px; }
.score-lbl-val { font-weight: 700; }

/* 근거 */
.rationale {
  font-size: 12px; color: var(--muted);
  line-height: 1.7; border-top: 1px solid var(--border);
  padding-top: 10px; margin-top: 2px;
}
.rationale em {
  font-style: normal; color: var(--text); font-weight: 600;
}

/* ── 반응형 */
@media (max-width: 600px) {
  .header-stats { display: none; }
  .apt-card { grid-template-columns: 56px 1fr; }
  .rank-num { font-size: 22px; }
}
</style>

const N_APTS = 1822;
const TOTAL_TRADES = 24634;

// 헤더 통계
document.getElementById('h-total').textContent = N_APTS.toLocaleString();
document.getElementById('h-trades').textContent = TOTAL_TRADES.toLocaleString();
const allMeds = APTS.map(a=>a.m).sort((a,b)=>a-b);
document.getElementById('h-med').textContent = (allMeds[Math.floor(allMeds.length/2)]/10000).toFixed(1)+'억';

// 탭 설명
const TAB_DESC = {
  total:   '<strong>종합 추천</strong> — 유동성(25pt) · 안정성(25pt) · 가성비(25pt) · 최신거래(15pt) · 건물상태(10pt) 균등 합산. 어떤 목적이든 두루 무난한 단지를 선별합니다.',
  live:    '<strong>실거주 추천</strong> — 가격 <em>안정성</em>과 <em>면적 대비 가성비</em>, <em>건물 상태</em>를 최우선으로 가중. 매일 살아야 하는 집의 품질과 유지비 관점에서 평가합니다.',
  invest:  '<strong>투자 추천</strong> — <em>거래 유동성</em>(환금성)과 <em>최근 시장 관심도</em>를 최우선 가중. 매입 후 재매도 시 손실 최소화 가능성이 높은 단지를 선별합니다.',
  bargain: '<strong>가성비 추천</strong> — <em>m²당 가격 역수</em>를 2배 가중. 동일 예산 대비 가장 넓은 면적을 확보할 수 있는 단지를 선별합니다.',
};

function lM(v) { return (v/10000).toFixed(2)+'억'; }

function getTags(a) {
  const t = [];
  if (a._l >= 19)  t.push({text:'거래 활발', cls:'tag-green'});
  if (a._l >= 13 && a._l < 19) t.push({text:'거래 양호', cls:'tag-green'});
  if (a._s >= 19)  t.push({text:'가격 안정', cls:'tag-blue'});
  if (a._v >= 19)  t.push({text:'가성비', cls:'tag-amber'});
  if (a._r > 0)    t.push({text:'최근 거래', cls:'tag-purple'});
  if (a.b && 2026-a.b <= 7)  t.push({text:'준신축', cls:'tag-teal'});
  if (a.b && 2026-a.b <= 15 && 2026-a.b > 7) t.push({text:'신축급', cls:'tag-teal'});
  if (a.b && 2026-a.b > 35) t.push({text:'재건축 후보', cls:'tag-red'});
  return t;
}

function getRationale(a) {
  const parts = [];
  const spread = Math.round((a.hi - a.lo) / a.m * 100);

  // 유동성
  if (a._l >= 19)
    parts.push(`2026년 <em>${a.c}건</em> 거래 — 경기남부 상위 유동성, 환금성 우수`);
  else if (a._l >= 13)
    parts.push(`<em>${a.c}건</em> 거래로 환금성 양호`);
  else
    parts.push(`<em>${a.c}건</em> 거래 (소량 거래, 환금성 유의)`);

  // 안정성
  if (a._s >= 19)
    parts.push(`가격 변동폭 <em>±${Math.round(spread/2)}%</em> 이내 — 시세 안정, 급락 리스크 낮음`);
  else if (a._s >= 12)
    parts.push(`변동폭 <em>${spread}%</em> 수준 (보통)`);
  else
    parts.push(`변동폭 <em>${spread}%</em> — 가격 변동성 <em>주의</em>`);

  // 가성비
  if (a.a) {
    const per = Math.round(a.m / a.a * 100);
    if (a._v >= 19)
      parts.push(`m²당 <em>${per}만원</em>으로 동급 최저가권`);
    else if (a._v >= 13)
      parts.push(`m²당 <em>${per}만원</em> (가성비 양호)`);
    else
      parts.push(`m²당 <em>${per}만원</em>`);
  }

  // 최신성
  if (a._r > 0)
    parts.push(`<em>최근 3개월</em> 내 거래 확인 — 시장 관심 지속 중`);

  // 건물
  if (a.b) {
    const age = 2026 - a.b;
    if (age <= 5)  parts.push(`<em>${a.b}년 준공</em> 준신축 — 관리비·하자 리스크 낮음`);
    else if (age <= 12) parts.push(`<em>${a.b}년 준공</em> 신축급 유지`);
    else if (age <= 20) parts.push(`<em>${a.b}년 준공</em> (${age}년차) — 리모델링 계획 확인 권장`);
    else if (age > 30) parts.push(`<em>${a.b}년 준공</em> (${age}년차) — 재건축 기대 가능, 현황 노후도 확인 필수`);
  }

  return parts.join('. ') + '.';
}

function renderCards(tab) {
  const scoreKey = '_' + tab;
  const sorted = [...APTS].filter(a => a[scoreKey] !== undefined)
                           .sort((a,b) => b[scoreKey] - a[scoreKey])
                           .slice(0, 20);
  const maxScore = sorted[0]?.[scoreKey] || 1;

  const list = document.getElementById('ranking-list');
  list.innerHTML = '';

  sorted.forEach((a, i) => {
    const rank = i + 1;
    const score = a[scoreKey];
    const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    const numCls = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    const tags = getTags(a);
    const rationale = getRationale(a);

    // 점수 바 세그먼트
    const total100 = a._l + a._s + a._v + a._r + a._b || 1;
    const segs = [
      { pct: a._l/total100*100, color: '#22C55E' },
      { pct: a._s/total100*100, color: '#60A5FA' },
      { pct: a._v/total100*100, color: '#E8A830' },
      { pct: a._r/total100*100, color: '#A78BFA' },
      { pct: a._b/total100*100, color: '#2DD4BF' },
    ];

    const metaParts = [
      a.s,
      a.c + '건',
      a.a ? a.a + '㎡' : null,
      a.b ? a.b + '년준공' : null,
      a.d ? '최근 ' + a.d.slice(0,7) : null,
    ].filter(Boolean);

    const card = document.createElement('div');
    card.className = 'apt-card';
    card.innerHTML = `
      <div class="card-rank">
        <div class="rank-num ${numCls}">${rank}</div>
        ${medal ? `<div class="rank-medal">${medal}</div>` : ''}
        <div class="rank-score">${score.toFixed(1)}pt</div>
      </div>
      <div class="card-body">
        <div class="card-head">
          <div class="apt-name">${a.n}</div>
          <div class="price-badge">${lM(a.m)}</div>
        </div>
        <div class="apt-meta">${metaParts.map((p,i)=> i>0?`<span>${p}</span>`:'<span>'+p+'</span>').join(' · ')}</div>
        <div class="tags">
          ${tags.map(t=>`<span class="tag ${t.cls}">${t.text}</span>`).join('')}
        </div>
        <div class="score-row">
          <div class="score-bar-wrap">
            ${segs.map(seg=>`<div class="score-seg" style="width:${seg.pct.toFixed(1)}%;background:${seg.color}"></div>`).join('')}
          </div>
          <div class="score-labels">
            <div class="score-lbl"><span class="score-lbl-name">유동성</span><span class="score-lbl-val">${a._l.toFixed(0)}</span></div>
            <div class="score-lbl"><span class="score-lbl-name">안정성</span><span class="score-lbl-val">${a._s.toFixed(0)}</span></div>
            <div class="score-lbl"><span class="score-lbl-name">가성비</span><span class="score-lbl-val">${a._v.toFixed(0)}</span></div>
            <div class="score-lbl"><span class="score-lbl-name">최신성</span><span class="score-lbl-val">${a._r}</span></div>
            <div class="score-lbl"><span class="score-lbl-name">건물</span><span class="score-lbl-val">${a._b}</span></div>
          </div>
        </div>
        <div class="rationale">${rationale}</div>
      </div>
    `;
    list.appendChild(card);
  });
}

// 탭 전환
let currentTab = 'total';
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.getElementById('tab-desc-text').innerHTML = TAB_DESC[currentTab];
    renderCards(currentTab);
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
});

// 초기 렌더
renderCards('total');
</script>
