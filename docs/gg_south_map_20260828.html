<title>경기 남부 아파트 4.5억 미만</title>
<style>
:root{
  --bg:#14161E;--bg2:#1C1F2E;--bg3:#242840;
  --border:#252840;--border2:#323660;
  --text:#E0E4F4;--muted:#5A6080;--muted2:#8A94B4;
  --gold:#F0B429;--red:#EF4444;--blue:#3B82F6;--green:#10B981;--orange:#F97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:13px;height:100vh;overflow:hidden;position:relative;}

/* 상단 바 */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:300;
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  pointer-events:none;
}
.logo{
  background:var(--bg2);border:1px solid var(--border2);
  padding:7px 13px;pointer-events:all;flex-shrink:0;
}
.logo-t{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--gold);}
.logo-s{font-size:9.5px;color:var(--muted2);margin-top:1px;}

.filter-bar{
  display:flex;gap:6px;flex-wrap:wrap;pointer-events:all;
}
.chip{
  background:var(--bg2);border:1px solid var(--border2);
  padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all .15s;white-space:nowrap;
}
.chip:hover,.chip.active{background:var(--gold);border-color:var(--gold);color:#000;}
.chip-badge{
  font-size:10px;background:rgba(255,255,255,.15);
  padding:1px 5px;border-radius:2px;font-family:monospace;
}

/* 통계 칩 */
.stat-bar{
  position:absolute;top:0;right:0;z-index:300;
  display:flex;gap:0;padding:10px 14px;pointer-events:none;
}
.stat-box{
  background:rgba(20,22,30,.85);border:1px solid var(--border2);
  padding:6px 12px;text-align:center;border-right:none;pointer-events:none;
}
.stat-box:last-child{border-right:1px solid var(--border2);}
.stat-v{font-size:16px;font-weight:800;font-family:'SF Mono','Consolas',monospace;}
.stat-u{font-size:9.5px;color:var(--muted2);margin-top:1px;}

/* 지도 */
#mapwrap{width:100%;height:100%;overflow:hidden;cursor:grab;position:relative;}
#mapwrap.dragging{cursor:grabbing;}
svg#ms{width:100%;height:100%;display:block;}

/* 경계 */
.bd{stroke:#2A3060;stroke-width:0.7;fill:transparent;transition:stroke .15s;}
.bd:hover{stroke:var(--gold);stroke-width:1.2;}

/* 시군구 클러스터 버블 */
.cluster-g{cursor:pointer;}
.cluster-bg{transition:r .2s,opacity .2s;}
.cluster-t{
  font-family:-apple-system,'Malgun Gothic',sans-serif;
  dominant-baseline:central;text-anchor:middle;
  pointer-events:none;
}

/* 단지 마커 */
.apt-mark{cursor:pointer;}
.apt-dot{transition:r .15s;}
.apt-lbl{
  font-family:-apple-system,'Malgun Gothic',sans-serif;
  dominant-baseline:central;text-anchor:middle;
  pointer-events:none;fill:#fff;font-weight:700;
}

/* 우측 상세 패널 */
.detail-panel{
  position:absolute;top:0;right:-360px;bottom:0;width:340px;
  background:var(--bg2);border-left:1px solid var(--border2);
  z-index:400;transition:right .25s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.detail-panel.open{right:0;}
.dp-header{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;
}
.dp-name{font-size:16px;font-weight:800;margin-bottom:4px;}
.dp-sgg{font-size:12px;color:var(--muted2);}
.dp-close{
  background:none;border:1px solid var(--border2);color:var(--muted2);
  width:28px;height:28px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.dp-close:hover{border-color:var(--gold);color:var(--gold);}

.dp-body{flex:1;overflow-y:auto;padding:16px 18px;}
.dp-price{
  font-size:32px;font-weight:800;font-family:'SF Mono','Consolas',monospace;
  margin-bottom:4px;
}
.dp-prange{font-size:12px;color:var(--muted2);margin-bottom:18px;}

.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:18px;}
.dp-cell{background:var(--bg2);padding:11px 12px;}
.dp-ck{font-size:10px;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.dp-cv{font-size:15px;font-weight:700;font-family:'SF Mono','Consolas',monospace;}

.recent-tag{
  display:inline-block;font-size:10px;padding:2px 7px;
  background:rgba(16,185,129,.15);border:1px solid var(--green);
  color:var(--green);font-weight:700;letter-spacing:.06em;margin-bottom:12px;
}

.dp-section-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px;}

/* 줌 컨트롤 */
.zoom-ctrl{
  position:absolute;bottom:40px;right:14px;z-index:300;
  display:flex;flex-direction:column;gap:4px;
}
.zoom-btn{
  width:36px;height:36px;background:var(--bg2);border:1px solid var(--border2);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.zoom-btn:hover{background:var(--gold);border-color:var(--gold);color:#000;}

/* 범례 */
.legend{
  position:absolute;bottom:12px;left:14px;z-index:300;
  background:rgba(20,22,30,.85);border:1px solid var(--border2);
  padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;
}
.li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted2);}
.ld{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

/* 가격 레이블 모드 힌트 */
.hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:300;
  background:rgba(20,22,30,.85);border:1px solid var(--border2);
  padding:5px 12px;font-size:10.5px;color:var(--muted2);pointer-events:none;
  transition:opacity .3s;
}
</style>

<!-- 상단 바 -->
<div class="topbar">
  <div class="logo">
    <div class="logo-t">경기남부 아파트</div>
    <div class="logo-s">4억5천 미만 · 2026.01~08</div>
  </div>
  <div class="filter-bar">
    <div class="chip active" id="f-all" onclick="setFilter('all')">전체 <span class="chip-badge" id="fb-all">—</span></div>
    <div class="chip" id="f-2" onclick="setFilter('~2')">2억 이하 <span class="chip-badge" id="fb-2">—</span></div>
    <div class="chip" id="f-3" onclick="setFilter('2~3')">2~3억 <span class="chip-badge" id="fb-3">—</span></div>
    <div class="chip" id="f-4" onclick="setFilter('3~4')">3~4억 <span class="chip-badge" id="fb-4">—</span></div>
    <div class="chip" id="f-45" onclick="setFilter('4~4.5')">4~4.5억 <span class="chip-badge" id="fb-45">—</span></div>
    <div class="chip" id="f-recent" onclick="toggleRecent()">최근3개월 ✦</div>
  </div>
</div>

<!-- 통계 -->
<div class="stat-bar">
  <div class="stat-box"><div class="stat-v gold" id="sv1">—</div><div class="stat-u">거래 건</div></div>
  <div class="stat-box"><div class="stat-v" id="sv2">—</div><div class="stat-u">단지</div></div>
  <div class="stat-box"><div class="stat-v" id="sv3">—</div><div class="stat-u">중간가</div></div>
</div>

<!-- 지도 -->
<div id="mapwrap">
  <svg id="ms" viewBox="0 0 760 560" preserveAspectRatio="xMidYMid meet">
    <rect width="760" height="560" fill="#14161E"/>
    <g id="bd-g"></g>
    <g id="cluster-g"></g>
    <g id="apt-g"></g>
  </svg>
  <div class="hint" id="hint">휠로 줌인 · 드래그로 이동 · 더블클릭으로 전체보기</div>
</div>

<!-- 우측 상세 패널 -->
<div class="detail-panel" id="dp">
  <div class="dp-header">
    <div>
      <div class="dp-name" id="dp-name">—</div>
      <div class="dp-sgg" id="dp-sgg">—</div>
    </div>
    <button class="dp-close" onclick="closePanel()">✕</button>
  </div>
  <div class="dp-body">
    <div id="dp-recent"></div>
    <div class="dp-price" id="dp-price">—</div>
    <div class="dp-prange" id="dp-range">—</div>
    <div class="dp-grid">
      <div class="dp-cell"><div class="dp-ck">거래 건수</div><div class="dp-cv" id="dp-cnt">—</div></div>
      <div class="dp-cell"><div class="dp-ck">전용면적</div><div class="dp-cv" id="dp-area">—</div></div>
      <div class="dp-cell"><div class="dp-ck">건축연도</div><div class="dp-cv" id="dp-year">—</div></div>
      <div class="dp-cell"><div class="dp-ck">최근 거래</div><div class="dp-cv" id="dp-date">—</div></div>
    </div>
    <div class="dp-section-title">단지 정보</div>
    <div style="font-size:12px;color:var(--muted2);line-height:1.8" id="dp-extra"></div>
  </div>
</div>

<!-- 줌 컨트롤 -->
<div class="zoom-ctrl">
  <button class="zoom-btn" onclick="zoom(0.7)">+</button>
  <button class="zoom-btn" onclick="zoom(1.43)">−</button>
  <button class="zoom-btn" onclick="resetView()" title="전체보기" style="font-size:13px">⊞</button>
</div>

<!-- 범례 -->
<div class="legend">
  <div class="li"><div class="ld" style="background:#94A3B8"></div>1억↓</div>
  <div class="li"><div class="ld" style="background:#3B82F6"></div>1~2억</div>
  <div class="li"><div class="ld" style="background:#10B981"></div>2~3억</div>
  <div class="li"><div class="ld" style="background:#F59E0B"></div>3~4억</div>
  <div class="li"><div class="ld" style="background:#EF4444"></div>4억+</div>
  <div class="li"><div class="ld" style="background:transparent;border:2px solid #fff;"></div>최근거래</div>
</div>

// ── 색상
function pc(m){
  if(m<10000)return'#94A3B8';
  if(m<20000)return'#3B82F6';
  if(m<30000)return'#10B981';
  if(m<40000)return'#F59E0B';
  return'#EF4444';
}
function lM(v){return(v/10000).toFixed(2)+'억';}

// ── ViewBox 상태
let vx=0,vy=0,vw=W0,vh=H0;
const ms=document.getElementById('ms');
function setVB(){ms.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);}

// ── 줌 레벨 (vw 기준: 낮을수록 더 줌인)
function zoomLevel(){return W0/vw;} // 1=전체, >2=줌인

// ── 경계 렌더
const bdG=document.getElementById('bd-g');
PATHS.forEach(p=>{
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',p.d);
  path.setAttribute('class','bd');
  path.dataset.name=p.name;
  bdG.appendChild(path);
});

// ── 필터 상태
let currentFilter='all', recentOnly=false;
function aptVisible(apt){
  if(recentOnly&&!apt.r)return false;
  switch(currentFilter){
    case'~2':return apt.m<20000;
    case'2~3':return apt.m>=20000&&apt.m<30000;
    case'3~4':return apt.m>=30000&&apt.m<40000;
    case'4~4.5':return apt.m>=40000&&apt.m<45000;
    default:return true;
  }
}

// ── 클러스터 렌더 (시군구 버블 — 줌아웃 상태)
const clG=document.getElementById('cluster-g');
const aptG=document.getElementById('apt-g');

function renderClusters(){
  clG.innerHTML='';
  const maxCnt=Math.max(...PATHS.map(p=>p.cnt));
  PATHS.forEach(p=>{
    if(!p.cnt)return;
    const r=Math.max(22,Math.min(46,22+p.cnt/maxCnt*24));
    const color=pc(p.med);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','cluster-g');
    g.style.cursor='pointer';

    // 배경원
    const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx',p.cx);bg.setAttribute('cy',p.cy);bg.setAttribute('r',r);
    bg.setAttribute('fill',color);bg.setAttribute('fill-opacity','0.25');
    bg.setAttribute('stroke',color);bg.setAttribute('stroke-width','1.5');
    bg.setAttribute('class','cluster-bg');

    // 이름 텍스트
    const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('x',p.cx);t1.setAttribute('y',p.cy-9);
    t1.setAttribute('class','cluster-t');
    t1.setAttribute('font-size','9');t1.setAttribute('fill',color);t1.setAttribute('font-weight','700');
    t1.textContent=p.short;

    // 가격 텍스트
    const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('x',p.cx);t2.setAttribute('y',p.cy+2);
    t2.setAttribute('class','cluster-t');
    t2.setAttribute('font-size','11');t2.setAttribute('fill','#fff');t2.setAttribute('font-weight','800');
    t2.textContent=p.med?lM(p.med):'';

    // 건수 텍스트
    const t3=document.createElementNS('http://www.w3.org/2000/svg','text');
    t3.setAttribute('x',p.cx);t3.setAttribute('y',p.cy+14);
    t3.setAttribute('class','cluster-t');
    t3.setAttribute('font-size','8');t3.setAttribute('fill','rgba(255,255,255,0.6)');
    t3.textContent=p.cnt?p.cnt.toLocaleString()+'건':'';

    g.appendChild(bg);g.appendChild(t1);g.appendChild(t2);g.appendChild(t3);
    g.addEventListener('click',()=>zoomTo(p));
    clG.appendChild(g);
  });
}

function zoomTo(p){
  // 해당 시군구로 줌인
  vx=p.cx-80;vy=p.cy-60;vw=160;vh=120;
  // 범위 내 클램프
  vx=Math.max(0,Math.min(W0-vw,vx));
  vy=Math.max(0,Math.min(H0-vh,vy));
  setVB();updateLayers();
}

// ── 단지 마커 렌더
let aptMarkers=[];
function renderApts(){
  aptG.innerHTML='';
  aptMarkers=[];
  const zl=zoomLevel();
  const showLabel=zl>=3.5;
  const showSmall=zl>=1.8;

  // 필터된 apt 수집
  const filtered=APTS.filter(a=>aptVisible(a));

  // 통계 갱신
  updateStats(filtered);

  filtered.forEach(apt=>{
    const baseR=showLabel?5:showSmall?3.5:2.5;
    const r=Math.max(baseR,Math.min(baseR+4,baseR+Math.log2(apt.c+1)*0.8));
    const color=pc(apt.m);

    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','apt-mark');

    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',apt.x);dot.setAttribute('cy',apt.y);dot.setAttribute('r',r);
    dot.setAttribute('fill',color);dot.setAttribute('class','apt-dot');
    dot.setAttribute('fill-opacity','0.88');
    if(apt.r){dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','1.2');}

    g.appendChild(dot);

    // 가격 레이블 (줌인 시)
    if(showLabel){
      // 배경 rect (pill)
      const priceTxt=(apt.m/10000).toFixed(1)+'억';
      const fw=priceTxt.length*5.8+8;
      const fh=14;

      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',apt.x-fw/2);rect.setAttribute('y',apt.y-r-fh-2);
      rect.setAttribute('width',fw);rect.setAttribute('height',fh);
      rect.setAttribute('rx','3');
      rect.setAttribute('fill',color);rect.setAttribute('fill-opacity','0.95');
      g.appendChild(rect);

      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',apt.x);txt.setAttribute('y',apt.y-r-fh/2-2);
      txt.setAttribute('class','apt-lbl');txt.setAttribute('font-size','8');
      txt.textContent=priceTxt;
      g.appendChild(txt);
    }

    g.addEventListener('click',()=>openPanel(apt));
    aptG.appendChild(g);
    aptMarkers.push({el:g,apt});
  });
}

function updateLayers(){
  const zl=zoomLevel();
  // 줌 레벨에 따라 클러스터/단지 전환
  clG.style.display=zl<1.6?'block':'none';
  renderApts();
}

// ── 통계 갱신
function updateStats(filtered){
  const trades=filtered.reduce((s,a)=>s+a.c,0);
  document.getElementById('sv1').textContent=trades.toLocaleString();
  document.getElementById('sv2').textContent=filtered.length.toLocaleString();
  if(filtered.length){
    const meds=filtered.map(a=>a.m).sort((a,b)=>a-b);
    document.getElementById('sv3').textContent=lM(meds[Math.floor(meds.length/2)]);
  }
  // 칩 배지
  const cnt=n=>APTS.filter(a=>aptVisible(a)&&(n==='all'?true:
    n==='~2'?a.m<20000:n==='2~3'?a.m>=20000&&a.m<30000:
    n==='3~4'?a.m>=30000&&a.m<40000:a.m>=40000)).length;
  document.getElementById('fb-all').textContent=APTS.filter(a=>!recentOnly||a.r).length;
  document.getElementById('fb-2').textContent=APTS.filter(a=>a.m<20000&&(!recentOnly||a.r)).length;
  document.getElementById('fb-3').textContent=APTS.filter(a=>a.m>=20000&&a.m<30000&&(!recentOnly||a.r)).length;
  document.getElementById('fb-4').textContent=APTS.filter(a=>a.m>=30000&&a.m<40000&&(!recentOnly||a.r)).length;
  document.getElementById('fb-45').textContent=APTS.filter(a=>a.m>=40000&&(!recentOnly||a.r)).length;
}

// ── 필터
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.chip[id^="f-"]').forEach(c=>c.classList.remove('active'));
  const ids={'all':'f-all','~2':'f-2','2~3':'f-3','3~4':'f-4','4~4.5':'f-45'};
  if(ids[f])document.getElementById(ids[f]).classList.add('active');
  renderApts();
}
function toggleRecent(){
  recentOnly=!recentOnly;
  document.getElementById('f-recent').classList.toggle('active',recentOnly);
  renderApts();
}

// ── 우측 패널
function openPanel(apt){
  const color=pc(apt.m);
  document.getElementById('dp-name').textContent=apt.n;
  document.getElementById('dp-sgg').textContent=apt.s;
  document.getElementById('dp-price').textContent=lM(apt.m);
  document.getElementById('dp-price').style.color=color;
  document.getElementById('dp-range').textContent=`거래 범위: ${lM(apt.lo)} ~ ${lM(apt.hi)}`;
  document.getElementById('dp-cnt').textContent=apt.c+'건';
  document.getElementById('dp-area').textContent=apt.a?apt.a+'㎡':'—';
  document.getElementById('dp-year').textContent=apt.b?apt.b+'년 ('+(2026-apt.b)+'년차)':'—';
  document.getElementById('dp-date').textContent=apt.d||'—';
  document.getElementById('dp-recent').innerHTML=apt.r?'<div class="recent-tag">2026.06~ 최근 거래</div>':'';
  document.getElementById('dp-extra').innerHTML=`
    <div>시군구: ${apt.s}</div>
    <div>중간 거래가: <b>${lM(apt.m)}</b></div>
    <div>최저가: ${lM(apt.lo)} / 최고가: ${lM(apt.hi)}</div>
    ${apt.b?'<div>건축연도: '+apt.b+'년 ('+apt.b+'년산)</div>':''}
    ${apt.a?'<div>전용면적: '+apt.a+'㎡ ('+Math.round(apt.a/3.305)+'평)</div>':''}
  `;
  document.getElementById('dp').classList.add('open');
}
function closePanel(){document.getElementById('dp').classList.remove('open');}

// ── 줌 / 팬
function zoom(factor,cx,cy){
  cx=cx??vx+vw/2;cy=cy??vy+vh/2;
  const nw=Math.max(40,Math.min(W0*2,vw*factor));
  const nh=Math.max(30,Math.min(H0*2,vh*factor));
  vx=cx-(cx-vx)*nw/vw;vy=cy-(cy-vy)*nh/vh;
  vw=nw;vh=nh;
  vx=Math.max(-W0*0.1,Math.min(W0*1.1-vw,vx));
  vy=Math.max(-H0*0.1,Math.min(H0*1.1-vh,vy));
  setVB();updateLayers();
}
function resetView(){vx=0;vy=0;vw=W0;vh=H0;setVB();updateLayers();closePanel();}

const wrap=document.getElementById('mapwrap');
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=ms.getBoundingClientRect();
  const scx=(e.clientX-rect.left)/rect.width*vw+vx;
  const scy=(e.clientY-rect.top)/rect.height*vh+vy;
  zoom(e.deltaY>0?1.18:0.85,scx,scy);
},{passive:false});

let drag=null;
wrap.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  drag={sx:e.clientX,sy:e.clientY,ovx:vx,ovy:vy};
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const rect=ms.getBoundingClientRect();
  const dx=(e.clientX-drag.sx)/rect.width*vw;
  const dy=(e.clientY-drag.sy)/rect.height*vh;
  vx=drag.ovx-dx;vy=drag.ovy-dy;
  setVB();
});
window.addEventListener('mouseup',()=>{
  drag=null;wrap.classList.remove('dragging');
});

// 터치
let touch1=null;
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    touch1={sx:e.touches[0].clientX,sy:e.touches[0].clientY,ovx:vx,ovy:vy};
  }
},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&touch1){
    e.preventDefault();
    const rect=ms.getBoundingClientRect();
    const dx=(e.touches[0].clientX-touch1.sx)/rect.width*vw;
    const dy=(e.touches[0].clientY-touch1.sy)/rect.height*vh;
    vx=touch1.ovx-dx;vy=touch1.ovy-dy;setVB();
  }
},{passive:false});
wrap.addEventListener('touchend',()=>{touch1=null;updateLayers();});

ms.addEventListener('dblclick',e=>{
  const rect=ms.getBoundingClientRect();
  const scx=(e.clientX-rect.left)/rect.width*vw+vx;
  const scy=(e.clientY-rect.top)/rect.height*vh+vy;
  zoom(0.45,scx,scy);
});

// 힌트 3초 후 숨김
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},3000);

// ── 초기 렌더
renderClusters();
updateLayers();
</script>
