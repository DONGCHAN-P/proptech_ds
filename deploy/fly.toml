# Fly.io 설정 — 서울 리전, 1GB 1대 상시 유지.
# app 이름은 Fly 전체에서 유일해야 한다. 도메인을 정하면 그 이름으로 바꾼다.
app = "CHANGE-ME"
primary_region = "icn"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # 후보 데이터를 메모리에 올려 두는 구조라, 멈췄다 깨면 첫 요청이 2초 걸린다 → 상시 1대
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
